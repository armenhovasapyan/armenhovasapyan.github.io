name: Deploy to GitHub Pages

# On every push, the position-specific CV PDFs (.NET / PHP / Node.js) are
# first regenerated from the site data (`app/data/site.ts`) via
# `npm run generate:pdf` and committed back to the repo — so the downloadable
# CVs are always the latest. The build job then receives the freshly
# generated PDFs (via artifact) and ships the static site with them.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  cv-pdf:
    name: Regenerate CV PDFs from site data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate CV PDF
        run: npm run generate:pdf

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: |
            public/Armen_Hovasapyan_CV_dotnet.pdf
            public/Armen_Hovasapyan_CV_php.pdf
            public/Armen_Hovasapyan_CV_nodejs.pdf

      - name: Commit updated PDF
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/Armen_Hovasapyan_CV_dotnet.pdf public/Armen_Hovasapyan_CV_php.pdf public/Armen_Hovasapyan_CV_nodejs.pdf; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "CV PDFs unchanged — nothing to commit"
          else
            git add public/Armen_Hovasapyan_CV_*.pdf
            git commit -m "chore: regenerate CV PDF from site data [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: cv-pdf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download freshly generated CV PDFs
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: public

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
